name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecucion anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected necesita historia para comparar contra la base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # En PR solo se comprueba lo afectado (seccion 3.1); en main, todo.
      #
      # `affected` elige los PROYECTOS por los archivos que cambiaron; lo que decide si la tarea
      # se ejecuta o sale de cache son los `inputs` de `nx.json`. Por eso el input `pruebas`
      # excluye los `.md`: tocar un AGENTS.md marca el proyecto como afectado, pero la tarea
      # acierta en cache y no corre nada.
      - name: Typecheck, lint y pruebas de lo afectado
        if: github.event_name == 'pull_request'
        run: npx nx affected -t typecheck lint test --base=origin/${{ github.base_ref }}

      - name: Typecheck, lint y pruebas de todo
        if: github.event_name != 'pull_request'
        run: npx nx run-many -t typecheck lint test

      # Comprueba que el limite type:module -> type:server-data sigue siendo un error.
      # Es la garantia del criterio de aceptacion de la seccion 9 sobre el principio 2.
      - name: Limites de dependencia entre modulos
        run: npm run verify:boundaries

      - name: Esquema de la base de identidad
        run: npm run verify:schema

  # ──────────────────────────────────────────────────────────────────────────────────────────
  # Navegador.
  #
  # Las pruebas de punta a punta cubren los criterios de la seccion 9 que no se pueden comprobar
  # de otra forma —accesibilidad con axe, contraste con el tema aplicado, que el navegador no
  # hable con nadie fuera del origen, que un Visor reciba 403 pidiendo /admin a mano— y hasta
  # ahora no corrian en CI: existian y solo se ejecutaban a mano.
  #
  # El job es independiente porque tarda ~7 minutos y necesita un navegador; ponerlo dentro de
  # `verificacion` alargaria el ciclo de cualquier cambio de tipos.
  # ──────────────────────────────────────────────────────────────────────────────────────────
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `affected` compara contra la base: sin historia no hay con que comparar.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      # `shell:e2e` depende de `shell:build`: nx construye antes de arrancar. Es lo que evita que
      # las pruebas midan una version anterior de la aplicacion.
      #
      # En PR solo corre si algo del grafo del shell cambio. Sus `inputs` incluyen el poblador
      # del cache, que no es dependencia suya por el grafo pero si por lo que la suite necesita
      # para arrancar: sin declararlo, un cambio en el poblador dejaria pasar un acierto de cache
      # sobre datos distintos.
      - name: Pruebas de navegador de lo afectado
        if: github.event_name == 'pull_request'
        run: npx nx affected -t e2e --base=origin/${{ github.base_ref }}

      - name: Pruebas de navegador
        if: github.event_name != 'pull_request'
        run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-navegador
          path: test-results/
          retention-days: 7

  infraestructura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Bicep
        run: |
          curl -sL -o /usr/local/bin/bicep \
            https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x /usr/local/bin/bicep

      # Una advertencia rompe el build: una propiedad mal ubicada en Bicep no falla el
      # despliegue, se ignora en silencio.
      - name: Compilar plantillas
        run: npm run verify:infra


  # ──────────────────────────────────────────────────────────────────────────────────────────
  # Etapa POR MODULO — seccion 3.4.
  #
  # Corre aparte de `verificacion` y NO la bloquea, que es el requisito: «un error de compilacion
  # en un modulo no debe bloquear el despliegue de los demas». Si esto viviera dentro del job de
  # verificacion, un modulo con un campo retirado pondria en rojo toda la ejecucion y con ella el
  # despliegue de los otros nueve.
  #
  # `continue-on-error` va en el PASO y no en el job: el job tiene que terminar en verde para que
  # el resumen y el artefacto se publiquen — es lo que lee el despliegue para decidir que apagar.
  # ──────────────────────────────────────────────────────────────────────────────────────────
  modulos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # El cache se puebla primero: la validacion contrasta cada modulo contra las columnas que
      # de verdad existen, no contra las que su definicion supone.
      - name: Poblar el cache
        run: npx tsx tools/poblar-cache.mts --connector mock --dir .cache-ci

      - name: Validar cada modulo por separado
        id: estado
        env:
          CACHE_DIR: .cache-ci
        run: npx tsx tools/estado-de-modulos.mts estado-de-modulos.json | tee $GITHUB_STEP_SUMMARY

      # Viaja al despliegue: es la lista de que se apaga y que no.
      - uses: actions/upload-artifact@v4
        with:
          name: estado-de-modulos
          path: estado-de-modulos.json

      # Un modulo caido no rompe la ejecucion, pero tiene que VERSE. Sin este paso, el informe
      # seria un archivo que nadie abre y los modulos se apagarian en silencio.
      - name: Avisar de los modulos caidos
        run: |
          caidos=$(jq -r '.modulos[] | select(.salud == "fallo") | .slug' estado-de-modulos.json)
          if [ -n "$caidos" ]; then
            for slug in $caidos; do
              echo "::warning title=Modulo caido::$slug no se puede componer y quedara APAGADO en produccion"
            done
          fi
